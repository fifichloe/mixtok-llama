# Pure LlamaGen counterpart of MixTok reconstruction/configs/top_p_train.yaml.
# The top-p selector and router have no counterpart in a dense 256-token VQ tokenizer.
epochs: 6
batch_size: 20
lr_llamagen_encoder: 1.0e-07
lr_llamagen: 4.0e-07
lr_d: 5.0e-05
lr_scheduler: cosine
warmup_steps: 0
warmup_epochs: 0.0
min_lr: 0.0
gan_start_epoch: 0.0
d_warmup_epochs: 0.0
ema_decay: 0.999
